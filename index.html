<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prolific HRMS | Prolific Business and Consultant</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Inter,Arial,sans-serif;background:#f4f7fb;color:#13233d}button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:250px;background:#10263e;color:#dbe8f5;position:fixed;inset:0 auto 0 0;padding:18px 10px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;border-bottom:1px solid #294159}.logo{width:42px;height:42px;background:#fff;color:#1475e8;border-radius:11px;display:grid;place-items:center;font-size:25px;font-weight:800}.brand b{display:block;color:#fff;font-size:15px}.brand small{color:#9fb5cb}.mini{display:flex;gap:10px;align-items:center;padding:17px 10px}.ava{width:38px;height:38px;border-radius:50%;background:#dcebff;color:#1766b4;display:grid;place-items:center;font-weight:800}.mini b{display:block;font-size:12px;color:#fff}.mini small{color:#9fb5cb}.nav button{width:100%;border:0;background:transparent;color:#dbe8f5;text-align:left;padding:11px 12px;border-radius:7px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#1b67a8;color:#fff}.foot{margin:22px 4px;padding:16px;border-radius:8px;background:#173650;font-weight:600;line-height:1.45}.main{margin-left:250px;width:calc(100% - 250px)}.top{height:74px;background:#fff;border-bottom:1px solid #e3e9f0;display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:5}.search{max-width:540px;flex:1;margin:auto;background:#f3f6f9;border-radius:8px;padding:11px 14px}.search input{border:0;outline:0;background:none;width:95%}.top .user{display:flex;align-items:center;gap:9px}.user small{display:block;color:#708096}.content{padding:18px;max-width:1500px;margin:auto}.hero{padding:27px;border-radius:10px;background:linear-gradient(110deg,#eef7ff,#d9ecff);display:flex;justify-content:space-between}.hero h1{margin:0;font-size:27px}.hero p{color:#50647d;margin:6px 0}.tag{font:18px Georgia;color:#16437c;line-height:1.5}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:15px 0}.card{background:#fff;border:1px solid #e3e9f0;border-radius:9px;box-shadow:0 7px 24px #142b4b0b}.kpi{padding:17px}.kpi strong{font-size:23px}.kpi label{display:block;color:#718096;margin-top:4px}.up{color:#21a366;font-size:11px;margin-top:10px}.down{color:#e25555;font-size:11px;margin-top:10px}.gr3{display:grid;grid-template-columns:1.25fr 1.25fr .95fr;gap:14px}.gr2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.head h3{margin:0;font-size:15px}.link{border:0;background:none;color:#1475e8;cursor:pointer}.bars{height:170px;display:flex;align-items:flex-end;gap:18px}.barbox{flex:1;text-align:center;color:#718096;font-size:10px}.bar{height:var(--h);background:#2f86e7;border-radius:5px 5px 0 0;margin:auto;width:48%;min-width:18px}.donut{width:128px;height:128px;border-radius:50%;background:conic-gradient(#2584e7 0 50%,#3db97a 50% 69%,#f3ab35 69% 83%,#8a63e8 83%);display:grid;place-items:center}.donut:after{content:'128\A leave days';white-space:pre;text-align:center;background:white;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:10px}.leaveflex{display:flex;align-items:center;gap:25px}.legend{font-size:11px;line-height:2}.holiday,.announce{padding:10px 0;border-bottom:1px solid #edf1f5}.holiday{display:flex;gap:11px}.date{width:44px;text-align:center;background:#f2f5f9;padding:6px;border-radius:6px;font-size:10px}.date b{display:block;font-size:13px}.holiday b,.announce b{font-size:12px}.muted{display:block;color:#718096;font-size:10px;margin-top:3px}.progress{margin:12px 0}.progress div{height:8px;background:#edf1f5;border-radius:9px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:#2b86e7;border-radius:9px}.quote{margin-top:14px;padding:20px 24px;background:#e2f1ff;border-radius:9px;font:16px Georgia;color:#154d86}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.title h2{margin:0;font-size:24px}.title p{margin:4px 0;color:#718096;font-size:12px}.btn{border:0;background:#1475e8;color:#fff;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:700}.secondary{background:#edf4fc;color:#1766ad}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 11px;border-bottom:1px solid #e5ebf2;font-size:12px}.table th{font-size:10px;color:#708096;background:#f8fafc}.badge{padding:4px 8px;border-radius:20px;font-size:10px;background:#e9f7ef;color:#208552}.badge.warn{background:#fff5df;color:#a66a08}.badge.red{background:#fdecec;color:#bb4c4c}.profile{display:grid;grid-template-columns:280px 1fr;gap:15px}.profilebox{text-align:center;padding:25px}.bigava{width:88px;height:88px;margin:auto;border-radius:50%;background:#dcebff;color:#1766b4;display:grid;place-items:center;font-size:27px;font-weight:800}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#718096;font-size:10px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dfe6ee;border-radius:7px;outline:none}.modalbg{display:none;position:fixed;inset:0;background:#07152599;z-index:20;align-items:center;justify-content:center;padding:20px}.modalbg.open{display:flex}.modal{background:#fff;border-radius:12px;width:min(620px,100%);padding:22px;max-height:90vh;overflow:auto}.modal h3{margin-top:0}.actions{text-align:right;margin-top:15px}.toast{position:fixed;right:20px;bottom:20px;background:#10263e;color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:30}.toast.show{display:block}.mobile{display:none}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.gr3,.gr2,.profile{grid-template-columns:1fr}.side{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}}
@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin-left:0;width:100%}.mobile{display:block;border:0;background:none;font-size:22px}.top{padding:0 12px}.user{display:none!important}.kpis{grid-template-columns:1fr}.hero{display:block}.tag{margin-top:15px}.content{padding:12px}}
</style></head>
<body><div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">P</div><div><b>Prolific</b><small>Business & Consultant</small></div></div><div class="mini"><div class="ava">PS</div><div><b>Priya Sharma</b><small>Employee</small></div></div><div class="nav" id="nav"></div><div class="foot">Together We Build a Brighter Tomorrow</div></aside><main class="main"><header class="top"><button class="mobile" id="mob">☰</button><div class="search">⌕ <input id="search" placeholder="Search employees, requests, policies..."></div><button class="link" id="bell">🔔</button><div class="user"><div class="ava">PS</div><div><b>Priya Sharma</b><small>Employee</small></div></div></header><section class="content" id="content"></section></main></div><div class="modalbg" id="mb"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const nav=[['dashboard','⌂','Dashboard'],['profile','◉','My Profile'],['employees','♙','Employee Directory'],['attendance','◷','Attendance & Timesheet'],['leave','▣','Leave Management'],['payroll','▤','Payroll'],['performance','↗','Performance'],['training','◇','Training & Development'],['documents','▱','Documents'],['helpdesk','?','HR Helpdesk'],['policies','☷','Company Policies'],['holidays','▦','Holiday Calendar'],['announcements','⚑','Announcements'],['admin','⚙','Admin Settings']];let page='dashboard';let leaves=JSON.parse(localStorage.getItem('pb_leaves')||'[]');const employees=[['PB001','Priya Sharma','Engineering','SAP CPI Consultant','priya@prolificbc.com'],['PB002','Arun Kumar','Engineering','Senior Developer','arun@prolificbc.com'],['PB003','Divya Rao','Human Resources','HR Manager','divya@prolificbc.com'],['PB004','Karthik S','Finance','Finance Analyst','karthik@prolificbc.com'],['PB005','Sneha R','Engineering','BTP Consultant','sneha@prolificbc.com']];
const $=id=>document.getElementById(id);function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function shell(t,s,action=''){return `<div class="title"><div><h2>${t}</h2><p>${s}</p></div>${action}</div>`}function badge(s){let c=s==='Pending'?'warn':s==='Rejected'?'red':'';return `<span class="badge ${c}">${s}</span>`}
function dashboard(){return `<div class="hero"><div><h1>Welcome back, Priya!</h1><p>Good afternoon! Here's what's happening at Prolific Business and Consultant.</p></div><div class="tag">Empowering People<br>Enabling Progress</div></div><div class="kpis">${[['👥','128','Total Employees','↑ 5% vs last month'],['📅','92%','Attendance Rate','↑ 2% vs last month'],['🌴','14','On Leave Today','↓ 1% vs last month'],['📄','8','Open HR Requests','↓ 20% vs last month'],['🎯','12','Ongoing Trainings','↑ 33% vs last month']].map((x,i)=>`<div class="card kpi"><div class="kpi-top"><span>${x[0]}</span><strong>${x[1]}</strong></div><label>${x[2]}</label><div class="${i==2||i==3?'down':'up'}">${x[3]}</div></div>`).join('')}</div><div class="gr3"><div class="card panel"><div class="head"><h3>Attendance Overview</h3><span class="muted">This Week</span></div><div class="bars">${[['Mon',80],['Tue',81],['Wed',70],['Thu',80],['Fri',87]].map(x=>`<div class="barbox"><div class="bar" style="--h:${x[1]}%"></div>${x[0]}</div>`).join('')}</div></div><div class="card panel"><div class="head"><h3>Leave Overview</h3><span class="muted">This Year</span></div><div class="leaveflex"><div class="donut"></div><div class="legend">🔵 Annual Leave — 56<br>🟢 Sick Leave — 24<br>🟠 Casual Leave — 18<br>🟣 Other — 30</div></div></div><div class="card panel"><div class="head"><h3>Upcoming Holidays</h3><button class="link" data-page="holidays">View All</button></div>${[['OCT','02','Gandhi Jayanti','Thursday'],['OCT','24','Diwali','Friday'],['DEC','25','Christmas','Thursday']].map(x=>`<div class="holiday"><div class="date">${x[0]}<b>${x[1]}</b></div><div><b>${x[2]}</b><span class="muted">${x[3]}</span></div></div>`).join('')}</div></div><div class="gr2"><div class="card panel"><div class="head"><h3>My Leave Balance</h3><button class="link" data-page="leave">View Details</button></div>${[['Annual Leave','12 / 18 days',67],['Sick Leave','6 / 10 days',60],['Casual Leave','4 / 6 days',67],['Comp Off','2 / 4 days',50]].map(x=>`<div class="progress"><b>${x[0]}</b><span class="muted">${x[1]}</span><div><i style="width:${x[2]}%"></i></div></div>`).join('')}</div><div class="card panel"><div class="head"><h3>Latest Announcements</h3><button class="link" data-page="announcements">View All</button></div>${[['Town Hall Meeting','15 Sep 2026 · Quarterly town hall'],['Annual Performance Review','FY 2025-26 review cycle begins soon.'],['New Joiners Welcome','Welcome to our newest colleagues.']].map(x=>`<div class="announce"><b>${x[0]}</b><span class="muted">${x[1]}</span></div>`).join('')}</div></div><div class="quote">“Great workplaces aren’t built by chance. They’re built by people.”</div>`}
function profile(){return shell('My Profile','View and update your employee information.','<button class="btn" id="edit">Edit Profile</button>')+`<div class="profile"><div class="card profilebox"><div class="bigava">PS</div><h3>Priya Sharma</h3><p class="muted">PB001 · SAP CPI Consultant</p><p>Engineering</p></div><div class="card panel"><h3>Personal & Employment Details</h3><div class="fields">${[['Full Name','Priya Sharma'],['Employee ID','PB001'],['Email','priya@prolificbc.com'],['Phone','+91 98765 43210'],['Location','Chennai, India'],['Joining Date','15 March 2023'],['Manager','Arun Kumar'],['Employment Type','Full Time']].map(x=>`<div class="field"><label>${x[0]}</label><input value="${x[1]}" disabled></div>`).join('')}</div></div></div>`}
function employeesPage(){return shell('Employee Directory','Search and view employee information.','<button class="btn" id="add">+ Add Employee</button>')+`<div class="card panel"><table class="table"><tr><th>ID</th><th>Employee</th><th>Department</th><th>Role</th><th>Email</th><th></th></tr>${employees.map(e=>`<tr><td>${e[0]}</td><td><b>${e[1]}</b></td><td>${e[2]}</td><td>${e[3]}</td><td>${e[4]}</td><td><button class="link" data-emp="${e[0]}">View</button></td></tr>`).join('')}</table></div>`}
function attendance(){return shell('Attendance & Timesheet','Track your daily attendance and working hours.','<button class="btn" id="clock">Clock In</button>')+`<div class="gr2"><div class="card panel"><h3>Today</h3><div class="kpi"><strong id="status">Not clocked in</strong><label>Clock-in: <span id="time">—</span></label></div></div><div class="card panel"><h3>This Week</h3><table class="table"><tr><th>Day</th><th>Hours</th><th>Status</th></tr>${[['Mon','8h 12m','Present'],['Tue','8h 05m','Present'],['Wed','7h 48m','Present'],['Thu','8h 10m','Present'],['Fri','—','Today']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${badge(x[2])}</td></tr>`).join('')}</table></div></div>`}
function leave(){return shell('Leave Management','Apply for leave and track approval status.','<button class="btn" id="apply">+ Apply Leave</button>')+`<div class="card panel"><table class="table"><tr><th>Request</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th></tr>${leaves.map(x=>`<tr><td>${x.id}</td><td>${x.type}</td><td>${x.from}</td><td>${x.to}</td><td>${x.days}</td><td>${x.reason}</td><td>${badge(x.status)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No leave requests yet.</td></tr>'}</table></div>`}
function payroll(){return shell('Payroll & Payslips','View your salary and payslip history.')+`<div class="gr2"><div class="card panel"><h3>Current Salary</h3><p class="muted">Monthly gross</p><h1>₹85,000</h1><p>Net salary: <b>₹72,450</b></p></div><div class="card panel"><h3>Latest Payslip</h3><p>August 2026 · Payroll processed</p><button class="btn" id="pay">Download Payslip</button></div></div><div class="card panel" style="margin-top:14px"><table class="table"><tr><th>Month</th><th>Gross</th><th>Deductions</th><th>Net</th><th></th></tr>${['Aug 2026','Jul 2026','Jun 2026','May 2026'].map(m=>`<tr><td>${m}</td><td>₹85,000</td><td>₹12,550</td><td>₹72,450</td><td><button class="link" data-pay="${m}">Download</button></td></tr>`).join('')}</table></div>`}
function simple(t,s,rows){return shell(t,s)+`<div class="card panel"><table class="table"><tr><th>Item</th><th>Details</th><th>Status</th></tr>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${badge(r[2]||'Active')}</td></tr>`).join('')}</table></div>`}
function render(){let v={dashboard,profile,employees:employeesPage,attendance,leave,payroll,performance:()=>simple('Performance','Goals, feedback and annual review cycle.',[['FY 2025-26 Review','Self assessment completed · Manager review pending','Pending'],['Delivery Excellence','Improve integration quality and automation','Active'],['Learning Goal','Complete BTP Integration Suite certification','Active']]),training:()=>simple('Training & Development','Learning programs and certifications.',[['SAP Integration Suite','Advanced integration patterns','Active'],['BTP Security','Identity and access fundamentals','Active'],['Leadership Essentials','People management program','Upcoming']]),documents:()=>simple('Documents','Your HR and employment documents.',[['Offer Letter','Employment offer · 2023','Verified'],['Employee Handbook','Company policies and handbook','Verified'],['Salary Certificate','FY 2025-26','Verified']]),helpdesk:()=>shell('HR Helpdesk','Raise and track employee requests.','<button class="btn" id="ticket">+ New Request</button>')+`<div class="card panel"><table class="table"><tr><th>Ticket</th><th>Subject</th><th>Category</th><th>Created</th><th>Status</th></tr><tr><td>HR-2088</td><td>PF statement request</td><td>Payroll</td><td>Sep 10, 2026</td><td>${badge('Open')}</td></tr><tr><td>HR-2071</td><td>Address update</td><td>Employee Data</td><td>Sep 05, 2026</td><td>${badge('Resolved')}</td></tr></table></div>`};content.innerHTML=(v[page]||(()=>simple('Admin Settings','Organization configuration and access.',[['Organization','Prolific Business and Consultant','Active'],['Roles & Permissions','Employee · Manager · HR · Admin','Active'],['Leave Types','Annual · Sick · Casual · Comp Off','Active']]))();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));bind()}
function modal(x){$('modal').innerHTML=x;$('mb').classList.add('open')}function close(){ $('mb').classList.remove('open')}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-emp]').forEach(b=>b.onclick=()=>{let e=employees.find(x=>x[0]===b.dataset.emp);modal(`<h3>${e[1]}</h3><div class="fields">${[['Employee ID',e[0]],['Department',e[2]],['Role',e[3]],['Email',e[4]]].map(x=>`<div class="field"><label>${x[0]}</label><input value="${x[1]}" disabled></div>`).join('')}</div><div class="actions"><button class="btn secondary" id="close">Close</button></div>`);$('close').onclick=close});if($('apply'))$('apply').onclick=()=>modal(`<h3>Apply for Leave</h3><form id="lf"><div class="fields"><div class="field"><label>Leave Type</label><select id="lt"><option>Annual Leave</option><option>Sick Leave</option><option>Casual Leave</option><option>Comp Off</option></select></div><div class="field"><label>Reason</label><input id="lr" required></div><div class="field"><label>From</label><input id="lfd" type="date" required></div><div class="field"><label>To</label><input id="ltd" type="date" required></div></div><div class="actions"><button type="button" class="btn secondary" id="cancel">Cancel</button> <button class="btn">Submit</button></div></form>`);if($('lf')){$('cancel').onclick=close;$('lf').onsubmit=e=>{e.preventDefault();let a=$('lfd').value,b=$('ltd').value;if(b<a)return toast('To date must be on or after From date');let days=(new Date(b)-new Date(a))/86400000+1;leaves.unshift({id:'LR-'+Math.floor(1000+Math.random()*8999),type:$('lt').value,reason:$('lr').value,from:a,to:b,days,status:'Pending'});localStorage.setItem('pb_leaves',JSON.stringify(leaves));close();toast('Leave request submitted');render()}}if($('clock'))$('clock').onclick=()=>{let t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('status').textContent='Clocked in';$('time').textContent=t;$('clock').textContent='Clock Out';$('clock').onclick=()=>{toast('Attendance updated successfully');$('clock').disabled=true;$('clock').textContent='Clocked Out'}};if($('pay'))$('pay').onclick=()=>toast('Payslip download prepared');document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>toast(`${b.dataset.pay} payslip prepared`));if($('edit'))$('edit').onclick=()=>modal('<h3>Edit Profile</h3><p>Profile editing is enabled for this demo. Connect the backend to persist changes securely.</p><div class="actions"><button class="btn" id="close">Close</button></div>');if($('close'))$('close').onclick=close;if($('add'))$('add').onclick=()=>toast('Employee creation form ready for HR/Admin');if($('ticket'))$('ticket').onclick=()=>modal('<h3>Raise HR Request</h3><div class="field"><label>Subject</label><input placeholder="Enter request subject"></div><div class="field" style="margin-top:12px"><label>Description</label><textarea rows="4"></textarea></div><div class="actions"><button class="btn" id="close">Submit Request</button></div>');if($('close'))$('close').onclick=()=>{close();toast('HR request created')};}
nav.forEach(x=>{$('nav').innerHTML+=`<button data-p="${x[0]}">${x[1]} &nbsp; ${x[2]}</button>`});$('nav').onclick=e=>{let b=e.target.closest('button');if(b){page=b.dataset.p;render();$('side').classList.remove('open')}};$('mob').onclick=()=>$('side').classList.toggle('open');$('bell').onclick=()=>toast('3 notifications: Town Hall, performance review, new training');$('mb').onclick=e=>{if(e.target===$('mb'))close()};$('search').oninput=e=>{if(e.target.value.length>2)toast('Search across HRMS modules')};render();
</script></body></html>
