<style>

<div id="login" class="login"><div class="loginbox"><div class="logo">P</div><h1>Prolific HRMS</h1><p class="muted">Prolific Business &amp; Consultant</p><form id="loginForm"><div class="field"><label>Login as</label><select id="role"><option value="admin">HR / Admin</option><option value="employee">Employee</option></select></div><div class="field"><label>Email / Username</label><input id="loginUser" required></div><div class="field"><label>Password</label><input id="loginPass" type="password" required></div><button class="btn">Login</button><div id="loginError" class="error hidden"></div></form><div class="demo"><b>Initial HR Admin</b><br>Username: admin@prolificbc.com<br>Password: Admin@123</div></div></div>
