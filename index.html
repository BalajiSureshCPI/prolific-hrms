:center;color:#718096;font-size:10px}.bar{height:var(--h);background:#2f86e7;border-radius:5px 5px 0 0;margin:auto;width:48%;min-width:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #e5ebf2;font-size:12px}.table th{font-size:10px;color:#708096;background:#f8fafc}.badge{padding:4px 8px;border-radius:20px;font-size:10px;background:#e9f7ef;color:#208552}.badge.warn{background:#fff5df;color:#a66a08}.badge.red{background:#fdecec;color:#bb4c4c}.progress{margin:12px 0}.progress div{height:8px;background:#edf1f5;border-radius:9px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:#2b86e7;border-radius:9px}.quote{margin-top:14px;padding:20px 24px;background:#e2f1ff;border-radius:9px;font:16px Georgia;color:#154d86}.profile{display:grid;grid-template-columns:280px 1fr;gap:15px}.profilebox{text-align:center;padding:25px}.bigava{width:88px;height:88px;margin:auto;border-radius:50%;background:#dcebff;color:#1766b4;display:grid;place-items:center;font-size:27px;font-weight:800}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modalbg{display:none;position:fixed;inset:0;background:#07152599;z-index:20;align-items:center;justify-content:center;padding:20px}.modalbg.open{display:flex}.modal{background:#fff;border-radius:12px;width:min(700px,100%);padding:22px;max-height:90vh;overflow:auto}.modal h3{margin-top:0}.actions{text-align:right;margin-top:15px}.toast{position:fixed;right:20px;bottom:20px;background:#10263e;color:#fff;padding:12px 16px;border-radius:8px;display:none;z-index:30}.toast.show{display:block}.mobile{display:none}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border:1px solid #e5ebf2;border-radius:8px}.stat b{display:block;font-size:20px}.stat span{color:#718096;font-size:11px}.notice{padding:10px;border-radius:8px;background:#fff8e8;color:#76520a;margin-bottom:12px;font-size:12px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.gr3,.gr2,.profile{grid-template-columns:1fr}.side{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}}@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin-left:0;width:100%}.mobile{display:block;border:0;background:none;font-size:22px}.top{padding:0 12px}.user{display:none!important}.kpis{grid-template-columns:1fr}.hero{display:block}.fields,.statrow{grid-template-columns:1fr}.content{padding:12px}}

<body>
<div id="login" class="login"><div class="loginbox"><div class="logo">P</div><h1>Prolific HRMS</h1><p class="muted">Prolific Business &amp; Consultant · Secure role-based demo</p><form id="loginForm"><div class="field"><label>Login as</label><select id="role"><option value="admin">HR / Admin</option><option value="employee">Employee</option></select></div><div class="field"><label>Email / Username</label><input id="loginUser" required autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" required autocomplete="current-password"></div><button class="btn">Login</button><div id="loginError" class="error hidden"></div></form><div class="demo"><b>Initial HR Admin login</b><br>Username: admin@prolificbc.com<br>Password: Admin@123</div></div></div>
<div id="app" class="app hidden"><aside class="side" id="side"><div class="brand"><div class="logo">P</div><div><b>Prolific</b><small>Business &amp; Consultant</small></div></div><div class="mini"><div class="ava" id="sideAvatar">AD</div><div><b id="sideName">HR Admin</b><small id="sideRole">Administrator</small></div></div><nav class="nav" id="nav"></nav><div class="foot">Together We Build a Brighter Tomorrow</div></aside><main class="main"><header class="top"><button class="mobile" id="mob">☰</button><div class="search">⌕ <input id="search" placeholder="Search employees, attendance, requests..."></div><button class="link" id="bell">🔔</button><div class="user"><div class="ava" id="topAvatar">AD</div><div><b id="topName">HR Admin</b><small id="topRole">Administrator</small></div></div><button class="btn secondary" id="logout">Logout</button></header><section class="content" id="content"></section></main></div>
<div class="modalbg" id="mb"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
(function(){'use strict';
var KEY='prolific_hrms_v2';
var state={users:[],attendance:[],timesheets:[]};
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object'){state=Object.assign(state,x)}}catch(e){}if(!state.users.length){state.users=[{id:'ADM001',name:'HR Admin',email:'admin@prolificbc.com',password:'Admin@123',role:'admin',department:'Human Resources',designation:'HR Administrator',active:true}] ;save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function $(id){return document.getElementById(id)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){if(!s)return '—';var d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function timeNow(){return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(function(){$('toast').classList.remove('show')},2200)}
function badge(s){var c=s==='Pending'?'warn':s==='Rejected'?'red':'';return '<span class="badge '+c+'">'+s+'</span>'}
function currentUser(){return state.users.find(function(u){return u.id===sessionStorage.getItem('prolific_user')})}
function initials(n){return (n||'User').split(' ').map(function(x){return x[0]}).slice(0,2).join('').toUpperCase()}
function shell(t,s,a){return '<div class="title"><div><h2>'+t+'</h2><p>'+s+'</p></div>'+(a||'')+'</div>'}
function navItems(){return currentUser().role==='admin'?[['dashboard','⌂','Dashboard'],['employees','♙','Employees'],['attendance','◷','Attendance & Timesheet'],['reports','▥','HR Reports'],['policies','☷','Policies'],['settings','⚙','Admin Settings']]:[['dashboard','⌂','Dashboard'],['profile','◉','My Profile'],['attendance','◷','My Attendance & Timesheet'],['leave','▣','Leave Management'],['payroll','▤','Payroll'],['documents','▱','Documents'],['policies','☷','Company Policies']];}
function renderNav(){ $('nav').innerHTML=navItems().map(function(x){return '<button data-p="'+x[0]+'">'+x[1]+'&nbsp; '+x[2]+'</button>'}).join('');$('nav').onclick=function(e){var b=e.target.closest('button');if(b){page=b.getAttribute('data-p');render()}}}
var page='dashboard';
function adminDashboard(){var emps=state.users.filter(function(u){return u.role==='employee'&&u.active!==false});var td=today();var present=state.attendance.filter(function(a){return a.date===td&&a.clockIn});var totalHours=state.timesheets.filter(function(t){return t.date===td}).reduce(function(s,t){return s+Number(t.hours||0)},0);return shell('HR Admin Dashboard','Manage employees, attendance and working hours.','<button class="btn" id="newEmp">+ Create Employee</button>')+'<div class="statrow"><div class="stat"><b>'+emps.length+'</b><span>Total Employees</span></div><div class="stat"><b>'+present.length+'</b><span>Clocked In Today</span></div><div class="stat"><b>'+totalHours.toFixed(2)+' h</b><span>Timesheet Hours Today</span></div><div class="stat"><b>8.00 h</b><span>Required Per Day</span></div></div><div class="card panel" style="margin-top:14px"><div class="head"><h3>Today Attendance</h3><span class="muted">'+fmtDate(td)+'</span></div><table class="table"><tr><th>Employee</th><th>Clock In</th><th>Clock Out</th><th>Worked</th><th>Timesheet</th><th>Balance</th></tr>'+emps.map(function(u){var a=state.attendance.find(function(x){return x.userId===u.id&&x.date===td});var hrs=state.timesheets.filter(function(t){return t.userId===u.id&&t.date===td}).reduce(function(s,t){return s+Number(t.hours||0)},0);var bal=hrs-8;return '<tr><td><b>'+u.name+'</b><br><span class="muted">'+u.id+' · '+u.department+'</span></td><td>'+(a?a.clockIn:'—')+'</td><td>'+(a?a.clockOut:'—')+'</td><td>'+((a&&a.clockIn&&a.clockOut)?workedHours(a.clockIn,a.clockOut).toFixed(2)+' h':'—')+'</td><td>'+hrs.toFixed(2)+' h</td><td>'+balanceText(bal)+'</td></tr>'}).join('')||'<tr><td colspan="6">No employees created yet.</td></tr>'+'</table></div>'}
function employeeDashboard(){var u=currentUser(),td=today(),a=state.attendance.find(function(x){return x.userId===u.id&&x.date===td}),hrs=state.timesheets.filter(function(t){return t.userId===u.id&&t.date===td}).reduce(function(s,t){return s+Number(t.hours||0)},0),week=weekDates().map(function(d){return state.timesheets.filter(function(t){return t.userId===u.id&&t.date===d}).reduce(function(s,t){return s+Number(t.hours||0)},0)}),sum=week.reduce(function(s,x){return s+x},0);return '<div class="hero"><div><h1>Welcome, '+u.name+'!</h1><p>Track your attendance and complete your 8-hour daily timesheet.</p></div><div class="tag">Required: <b>8.00 hrs/day</b><br>Target: <b>40.00 hrs/week</b></div></div><div class="kpis"><div class="card kpi">🕘 <strong>'+(a?a.clockIn:'—')+'</strong><label>Clock In</label></div><div class="card kpi">⏰ <strong>'+(a&&a.clockOut?a.clockOut:'—')+'</strong><label>Clock Out</label></div><div class="card kpi">📝 <strong>'+hrs.toFixed(2)+' h</strong><label>Today Timesheet</label><div class="'+(hrs>=8?'up':'down')+'">'+balanceText(hrs-8)+'</div></div><div class="card kpi">📊 <strong>'+sum.toFixed(2)+' h</strong><label>This Week</label><div class="'+(sum>=40?'up':'down')+'">'+balanceText(sum-40)+'</div></div><div class="card kpi">🎯 <strong>8.00 h</strong><label>Daily Requirement</label></div></div><div class="gr2"><div class="card panel"><div class="head"><h3>Today Attendance</h3><button class="btn" id="clock">'+(a&&a.clockOut?'Completed':a?'Clock Out':'Clock In')+'</button></div><p>Status: <b>'+(a&&a.clockOut?'Day completed':a?'Currently working':'Not clocked in')+'</b></p><p>Clock In: <b>'+(a?a.clockIn:'—')+'</b> &nbsp; Clock Out: <b>'+(a&&a.clockOut?a.clockOut:'—')+'</b></p><p>Clocked duration: <b>'+((a&&a.clockIn&&a.clockOut)?workedHours(a.clockIn,a.clockOut).toFixed(2)+' hours':'—')+'</b></p></div><div class="card panel"><div class="head"><h3>Weekly Hours</h3><button class="btn secondary" id="timesheet">+ Add Timesheet</button></div><table class="table"><tr><th>Date</th><th>Hours</th><th>Balance</th></tr>'+weekDates().map(function(d){var h=state.timesheets.filter(function(t){return t.userId===u.id&&t.date===d}).reduce(function(s,t){return s+Number(t.hours||0)},0);return '<tr><td>'+fmtDate(d)+'</td><td>'+h.toFixed(2)+' h</td><td>'+balanceText(h-8)+'</td></tr>'}).join('')+'</table></div></div>'}
function balanceText(n){return n>=0?'+'+n.toFixed(2)+' h':'-'+Math.abs(n).toFixed(2)+' h'}
function weekDates(){var d=new Date();var day=d.getDay();var diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);var a=[];for(var i=0;i<5;i++){var x=new Date(d);x.setDate(d.getDate()+i);a.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'))}return a}
function workedHours(inTime,outTime){function m(t){var p=t.match(/(\d+):(\d+)\s*(AM|PM)?/i);if(!p)return 0;var h=Number(p[1]),mi=Number(p[2]);if(p[3]){if(p[3].toUpperCase()==='PM'&&h<12)h+=12;if(p[3].toUpperCase()==='AM'&&h===12)h=0}return h*60+mi}var x=m(outTime)-m(inTime);if(x<0)x+=1440;return x/60}
function employeesPage(){return shell('Employee Management','Create employee accounts and manage access.','<button class="btn" id="newEmp">+ Create Employee</button>')+'<div class="notice">Employee credentials are stored in this browser for this prototype. For real company deployment, connect a secure backend/database and hashed passwords.</div><div class="card panel"><table class="table"><tr><th>Employee ID</th><th>Name</th><th>Email/Login</th><th>Department</th><th>Designation</th><th>Status</th></tr>'+state.users.filter(function(u){return u.role==='employee'}).map(function(u){return '<tr><td>'+u.id+'</td><td><b>'+u.name+'</b></td><td>'+u.email+'</td><td>'+u.department+'</td><td>'+u.designation+'</td><td>'+badge(u.active===false?'Inactive':'Active')+'</td></tr>'}).join('')||'<tr><td colspan="6">No employee accounts yet.</td></tr>'+'</table></div>'}
function attendanceAdmin(){var emps=state.users.filter(function(u){return u.role==='employee'});return shell('Attendance & Timesheet','View employee clock-in/out and daily 8-hour timesheets.','<button class="btn" id="newEmp">+ Create Employee</button>')+'<div class="card panel"><div class="field"><label>Attendance date</label><input id="reportDate" type="date" value="'+today()+'"></div><table class="table" id="attTable"><tr><th>Employee</th><th>Clock In</th><th>Clock Out</th><th>Worked</th><th>Timesheet</th><th>Daily Balance</th></tr>'+attendanceRows(emps,today())+'</table></div>'}
function attendanceRows(emps,date){return emps.map(function(u){var a=state.attendance.find(function(x){return x.userId===u.id&&x.date===date}),h=state.timesheets.filter(function(t){return t.userId===u.id&&t.date===date}).reduce(function(s,t){return s+Number(t.hours||0)},0),wh=a&&a.clockIn&&a.clockOut?workedHours(a.clockIn,a.clockOut):0;return '<tr><td><b>'+u.name+'</b><br><span class="muted">'+u.id+'</span></td><td>'+(a?a.clockIn:'—')+'</td><td>'+(a&&a.clockOut?a.clockOut:'—')+'</td><td>'+wh.toFixed(2)+' h</td><td>'+h.toFixed(2)+' h</td><td>'+balanceText(h-8)+'</td></tr>'}).join('')||'<tr><td colspan="6">No employees.</td></tr>'}
function reports(){var emps=state.users.filter(function(u){return u.role==='employee'}),td=today();return shell('HR Reports','Correctly calculated attendance and timesheet summary.')+'<div class="statrow"><div class="stat"><b>'+emps.length+'</b><span>Employees</span></div><div class="stat"><b>'+emps.filter(function(u){return state.attendance.some(function(a){return a.userId===u.id&&a.date===td&&a.clockIn})}).length+'</b><span>Present Today</span></div><div class="stat"><b>'+state.timesheets.filter(function(t){return t.date===td}).reduce(function(s,t){return s+Number(t.hours||0)},0).toFixed(2)+' h</b><span>Total Timesheet Today</span></div><div class="stat"><b>'+emps.reduce(function(s,u){return s+weekDates().reduce(function(q,d){return q+state.timesheets.filter(function(t){return t.userId===u.id&&t.date===d}).reduce(function(z,t){return z+Number(t.hours||0)},0)},0)},0).toFixed(2)+' h</b><span>Total This Week</span></div></div><div class="card panel" style="margin-top:14px"><table class="table"><tr><th>Employee</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Week Total</th></tr>'+emps.map(function(u){var hs=weekDates().map(function(d){return state.timesheets.filter(function(t){return t.userId===u.id&&t.date===d}).reduce(function(s,t){return s+Number(t.hours||0)},0)});return '<tr><td><b>'+u.name+'</b></td>'+hs.map(function(h){return '<td>'+h.toFixed(2)+'</td>'}).join('')+'<td><b>'+hs.reduce(function(s,h){return s+h},0).toFixed(2)+' h</b></td></tr>'}).join('')+'</table></div>'}
function profile(){var u=currentUser();return shell('My Profile','Employee information.')+'<div class="profile"><div class="card profilebox"><div class="bigava">'+initials(u.name)+'</div><h3>'+u.name+'</h3><p class="muted">'+u.id+' · '+u.designation+'</p><p>'+u.department+'</p></div><div class="card panel"><div class="fields">'+[['Full Name',u.name],['Employee ID',u.id],['Email',u.email],['Department',u.department],['Designation',u.designation],['Joining Date',u.joiningDate||'—']].map(function(x){return '<div class="field"><label>'+x[0]+'</label><input value="'+x[1]+'" disabled></div>'}).join('')+'</div></div></div>'}
function leave(){return shell('Leave Management','Apply for leave and track requests.','<button class="btn" id="apply">+ Apply Leave</button>')+'<div class="card panel"><p>No leave requests are configured in this prototype yet.</p></div>'}
function payroll(){return shell('Payroll','View payroll information.','')+'<div class="card panel"><p>Payroll module is ready for backend integration. Salary information should only be stored in the secure server/database.</p></div>'}
function simple(title,sub,rows){return shell(title,sub)+'<div class="card panel"><table class="table"><tr><th>Item</th><th>Details</th><th>Status</th></tr>'+rows.map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+badge(r[2]||'Active')+'</td></tr>'}).join('')+'</table></div>'}
function render(){var u=currentUser();renderNav();$('sideName').textContent=u.name;$('sideRole').textContent=u.role==='admin'?'HR Administrator':'Employee';$('topName').textContent=u.name;$('topRole').textContent=u.role==='admin'?'Administrator':'Employee';$('sideAvatar').textContent=initials(u.name);$('topAvatar').textContent=initials(u.name);var views=u.role==='admin'?{dashboard:adminDashboard,employees:employeesPage,attendance:attendanceAdmin,reports:reports,policies:function(){return simple('Company Policies','HR policies.',[['Employee Handbook','Workplace guidelines','Active'],['Leave Policy','Leave rules','Active'],['Information Security','Security requirements','Active']])},settings:function(){return shell('Admin Settings','HR administration.')+'<div class="card panel"><p><b>Admin account:</b> '+u.email+'</p><p>Employee accounts can be created from Employee Management.</p></div>'}}:{dashboard:employeeDashboard,profile:profile,attendance:employeeDashboard,leave:leave,payroll:payroll,documents:function(){return simple('Documents','Employee documents.',[['Employee Handbook','Company handbook','Available'],['Employment Letter','Employment documentation','Available']])},policies:function(){return simple('Company Policies','Company policies.',[['Employee Handbook','Workplace guidelines','Active'],['Leave Policy','Leave rules','Active']])}};if(!views[page])page='dashboard';$('content').innerHTML=views[page]();document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-p')===page)});bind()}
function openModal(html){$('modal').innerHTML=html;$('mb').classList.add('open')}
function closeModal(){$('mb').classList.remove('open')}
function createEmployee(){openModal('<h3>Create Employee Login</h3><div class="fields"><div class="field"><label>Full Name</label><input id="en"></div><div class="field"><label>Employee ID</label><input id="eid" placeholder="PB006"></div><div class="field"><label>Email / Login</label><input id="ee" type="email"></div><div class="field"><label>Temporary Password</label><input id="ep" value="Emp@12345"></div><div class="field"><label>Department</label><input id="ed"></div><div class="field"><label>Designation</label><input id="ej"></div><div class="field"><label>Joining Date</label><input id="ejd" type="date"></div></div><div class="actions"><button class="btn secondary" id="cancel">Cancel</button> <button class="btn" id="saveEmp">Create Login</button></div>');$('cancel').onclick=closeModal;$('saveEmp').onclick=function(){var name=$('en').value.trim(),id=$('eid').value.trim(),email=$('ee').value.trim().toLowerCase(),pass=$('ep').value,dep=$('ed').value.trim(),des=$('ej').value.trim();if(!name||!id||!email||!pass||!dep||!des){toast('Please fill all required fields');return}if(state.users.some(function(x){return x.id===id||x.email===email})){toast('Employee ID or email already exists');return}state.users.push({id:id,name:name,email:email,password:pass,role:'employee',department:dep,designation:des,joiningDate:$('ejd').value,active:true});save();closeModal();toast('Employee login created successfully');render()}}
function addTimesheet(){var u=currentUser();openModal('<h3>Fill Daily Timesheet</h3><p class="muted">Enter actual hours worked. The system compares your total with the required 8.00 hours.</p><div class="field"><label>Date</label><input id="tsd" type="date" value="'+today()+'"></div><div class="field"><label>Hours Worked</label><input id="tsh" type="number" min="0" max="24" step="0.25" placeholder="8.00"></div><div class="field"><label>Work Description</label><textarea id="tsdesc" rows="3" placeholder="Tasks completed today"></textarea></div><div class="actions"><button class="btn" id="saveTs">Save Timesheet</button></div>');$('saveTs').onclick=function(){var d=$('tsd').value,h=Number($('tsh').value),desc=$('tsdesc').value.trim();if(!d||!isFinite(h)||h<=0||h>24){toast('Enter valid hours between 0 and 24');return}state.timesheets.push({id:'TS'+Date.now(),userId:u.id,date:d,hours:h,description:desc});save();closeModal();toast('Timesheet saved: '+h.toFixed(2)+' hours');render()}}
function bind(){if($('newEmp'))$('newEmp').onclick=createEmployee;if($('timesheet'))$('timesheet').onclick=addTimesheet;if($('clock'))$('clock').onclick=function(){var u=currentUser(),d=today(),a=state.attendance.find(function(x){return x.userId===u.id&&x.date===d});if(!a){state.attendance.push({userId:u.id,date:d,clockIn:timeNow(),clockOut:''});save();toast('Clocked in at '+timeNow());render()}else if(!a.clockOut){a.clockOut=timeNow();save();toast('Clocked out at '+a.clockOut);render()}else toast('Today attendance is already completed')};if($('reportDate'))$('reportDate').onchange=function(){var d=this.value;var table=$('attTable');var emps=state.users.filter(function(u){return u.role==='employee'});table.innerHTML='<tr><th>Employee</th><th>Clock In</th><th>Clock Out</th><th>Worked</th><th>Timesheet</th><th>Daily Balance</th></tr>'+attendanceRows(emps,d)};if($('apply'))$('apply').onclick=function(){openModal('<h3>Apply Leave</h3><p>This module can be connected to the approval workflow after the employee/manager backend is added.</p><div class="actions"><button class="btn" id="close">Close</button></div>');$('close').onclick=closeModal};document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){page=b.getAttribute('data-page');render()}})}
$('loginForm').onsubmit=function(e){e.preventDefault();load();var role=$('role').value,user=$('loginUser').value.trim().toLowerCase(),pass=$('loginPass').value;var u=state.users.find(function(x){return x.email.toLowerCase()===user&&x.password===pass&&x.active!==false});if(!u||u.role!==role){$('loginError').textContent='Invalid username, password, or selected role.';$('loginError').classList.remove('hidden');return}sessionStorage.setItem('prolific_user',u.id);$('loginError').classList.add('hidden');$('login').classList.add('hidden');$('app').classList.remove('hidden');page='dashboard';render()};$('logout').onclick=function(){sessionStorage.removeItem('prolific_user');location.reload()};$('mob').onclick=function(){$('side').classList.toggle('open')};$('bell').onclick=function(){toast('No new notifications')};$('mb').onclick=function(e){if(e.target===$('mb'))closeModal()};load();
if(sessionStorage.getItem('prolific_user')&&currentUser()){$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}
})();
</script>
</body>
</html>
